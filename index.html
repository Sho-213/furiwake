<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チーム分け</title>
  
  <!-- Google Fonts（丸みとモダンさを両立したスタイリッシュなフォント） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <!-- 外部ライブラリ（QRコード生成 & Firebaseリアルタイムデータベース） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  
  <style>
    /* -------------------------------------------------------------
       カラーパレット（ライトモード＝元コードのパステル配色）
    ------------------------------------------------------------- */
    :root {
      --bg-base: #f7f7fc;
      --bg-grad-1: #d9d3ff;
      --bg-grad-2: #c0f5e8;
      --ink: #182033;
      --muted: #71809b;
      --paper: rgba(255, 253, 248, 0.92);
      --card-border: rgba(255, 255, 255, 0.95);
      --card-shadow: 0 20px 50px rgba(44, 37, 90, 0.12);
      --deco-circle: #ede9ff;
      --purple: #6548ed;
      --violet: #9a62ff;
      --mint: #37d5ae;
      --badge-bg: #e9e5ff;
      --badge-ink: #5540d2;
      --input-bg: #ffffff;
      --input-border: #dedcea;
      --item-bg: #f6f5fb;
      --item-border: transparent;
      --item-elim-bg: #f1f0f4;
      --item-elim-ink: #9b97a7;
      --team-card-bg: rgba(255, 255, 255, 0.85);
      --team-card-border: rgba(101, 72, 237, 0.14);
      --result-ink: #432eae;
      --danger-bg: #fff1f2;
      --danger-hover: #ffe0e3;
      --danger-ink: #e25667;
      --qr-btn-bg: #272a4b;
      --modal-bg: #fffdf8;
      --toggle-bg: rgba(101, 72, 237, 0.1);
      --toggle-hover: rgba(101, 72, 237, 0.18);

      /* 学年別カラー（ライト） */
      --g1-bg: #dffaf2;
      --g1-ink: #0f8a6c;
      --g1-border: #9be8d2;
      --g2-bg: #e7e4ff;
      --g2-ink: #5338d4;
      --g2-border: #bfb6ff;
      --g3-bg: #ffe7e2;
      --g3-ink: #d4432a;
      --g3-border: #ffb8ab;

      --font-sans: "Plus Jakarta Sans", "Noto Sans JP", "Hiragino Sans", sans-serif;
      --font-display: "Zen Maru Gothic", "Plus Jakarta Sans", "Noto Sans JP", sans-serif;
    }

    /* -------------------------------------------------------------
       ダークモードのカラーパレット（深いミッドナイト・グラス）
    ------------------------------------------------------------- */
    html[data-theme="dark"] {
      --bg-base: #0d0f1a;
      --bg-grad-1: rgba(101, 72, 237, 0.28);
      --bg-grad-2: rgba(55, 213, 174, 0.20);
      --ink: #f3f4fa;
      --muted: #98a2bd;
      --paper: rgba(22, 26, 45, 0.84);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      --deco-circle: rgba(101, 72, 237, 0.14);
      --purple: #9b85ff;
      --violet: #b18aff;
      --mint: #37d5ae;
      --badge-bg: rgba(101, 72, 237, 0.24);
      --badge-ink: #c7baff;
      --input-bg: rgba(13, 15, 26, 0.75);
      --input-border: rgba(255, 255, 255, 0.12);
      --item-bg: rgba(255, 255, 255, 0.05);
      --item-border: rgba(255, 255, 255, 0.06);
      --item-elim-bg: rgba(255, 255, 255, 0.02);
      --item-elim-ink: #646d87;
      --team-card-bg: rgba(30, 35, 60, 0.76);
      --team-card-border: rgba(255, 255, 255, 0.10);
      --result-ink: #c4b5fd;
      --danger-bg: rgba(244, 63, 94, 0.15);
      --danger-hover: rgba(244, 63, 94, 0.26);
      --danger-ink: #fb7185;
      --qr-btn-bg: #313866;
      --modal-bg: #171b30;
      --toggle-bg: rgba(255, 255, 255, 0.08);
      --toggle-hover: rgba(255, 255, 255, 0.16);

      /* 学年別カラー（ダーク） */
      --g1-bg: rgba(55, 213, 174, 0.18);
      --g1-ink: #5eead4;
      --g1-border: rgba(55, 213, 174, 0.35);
      --g2-bg: rgba(139, 92, 246, 0.22);
      --g2-ink: #c4b5fd;
      --g2-border: rgba(139, 92, 246, 0.40);
      --g3-bg: rgba(251, 113, 133, 0.20);
      --g3-ink: #fda4af;
      --g3-border: rgba(251, 113, 133, 0.38);
    }

    /* -------------------------------------------------------------
       全体レイアウト・リセットスタイル
    ------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 5% 0%, var(--bg-grad-1) 0, transparent 31rem),
        radial-gradient(circle at 95% 95%, var(--bg-grad-2) 0, transparent 32rem);
      transition: background-color 0.35s ease, color 0.35s ease;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
      gap: 22px;
    }

    @media (min-width: 880px) {
      .container {
        flex-direction: row;
        align-items: stretch;
        min-height: 100vh;
      }
    }

    /* 共通カードデザイン（グラスモーフィズム） */
    .main-content, .sidebar, .user-card {
      background: var(--paper);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    /* メインコンテンツ（チーム分け設定＆結果表示エリア） */
    .main-content {
      flex: 1.75;
      display: flex;
      flex-direction: column;
      padding: 28px 28px 25px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      gap: 16px;
    }

    .main-content::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--deco-circle);
      top: -180px;
      right: -130px;
      z-index: 0;
      pointer-events: none;
      transition: background 0.35s ease;
    }

    .main-content > * {
      position: relative;
      z-index: 1;
    }

    /* サイドバー（メンバー管理・一括テキスト・QRコードエリア） */
    .sidebar {
      flex: 1.05;
      min-width: 330px;
      padding: 24px 22px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 880px) {
      .sidebar {
        max-height: calc(100vh - 48px);
        position: sticky;
        top: 24px;
      }
    }

    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .title-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 900;
    }

    h1 {
      font-size: clamp(25px, 3.6vw, 35px);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .host-badge {
      color: var(--badge-ink);
      background: var(--badge-bg);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    /* ダーク/ライト切り替え・サウンド切り替えボタン共通 */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--toggle-bg);
      color: var(--ink);
      border: 1px solid var(--card-border);
      box-shadow: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.17s, color 0.3s;
    }

    .theme-toggle:hover:not(:disabled) {
      background: var(--toggle-hover);
      transform: translateY(-1px);
      box-shadow: none;
    }

    .theme-toggle svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* -------------------------------------------------------------
       チーム分け設定コントロールボックス
    ------------------------------------------------------------- */
    .control-box {
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 620px) {
      .control-grid {
        grid-template-columns: 1.15fr 1fr;
      }
    }

    .control-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    .mode-tabs {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 13px;
      padding: 4px;
      gap: 4px;
    }

    .mode-tab-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      background: transparent;
      box-shadow: none;
    }

    .mode-tab-btn:hover:not(:disabled) {
      transform: none;
      filter: none;
      box-shadow: none;
      color: var(--ink);
    }

    .mode-tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #7354ef, #4c75ee);
      box-shadow: 0 4px 10px rgba(87, 75, 196, 0.25);
    }

    .stepper-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 13px;
      padding: 4px;
      gap: 6px;
    }

    .stepper-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 10px;
      font-size: 18px;
      display: grid;
      place-items: center;
      background: var(--toggle-bg);
      color: var(--ink);
      box-shadow: none;
    }

    .stepper-btn:hover:not(:disabled) {
      background: var(--toggle-hover);
      box-shadow: none;
    }

    .stepper-value {
      min-width: 74px;
      text-align: center;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
    }

    .sim-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--badge-ink);
      background: var(--badge-bg);
      padding: 6px 11px;
      border-radius: 10px;
    }

    .main-action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #divide-btn {
      flex: 2;
      min-width: 200px;
      border-radius: 16px;
      padding: 14px 26px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(120deg, #ff7f81, #f64f74);
      box-shadow: 0 11px 22px rgba(246, 79, 116, 0.28);
    }

    #copy-result-btn {
      flex: 1;
      min-width: 130px;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 14px;
      background: linear-gradient(135deg, #35b997, #27a383);
      box-shadow: 0 8px 18px rgba(53, 185, 151, 0.25);
    }

    /* -------------------------------------------------------------
       チーム分け結果表示エリア
    ------------------------------------------------------------- */
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .result-header h2 {
      font-size: 19px;
      color: var(--result-ink);
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 14px;
      flex: 1;
      align-content: start;
    }

    .empty-result {
      grid-column: 1 / -1;
      border: 2px dashed var(--input-border);
      border-radius: 22px;
      padding: 44px 20px;
      text-align: center;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 240px;
    }

    .team-card {
      background: var(--team-card-bg);
      border: 1.5px solid var(--team-card-border);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(30, 25, 70, 0.05);
      animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .team-card.shuffling {
      animation: shakeCard 0.16s infinite alternate ease-in-out;
    }

    @keyframes shakeCard {
      0% { transform: scale(0.985) rotate(-0.6deg); }
      100% { transform: scale(1.005) rotate(0.6deg); }
    }

    .team-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--item-border);
    }

    .team-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .team-color-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .team-size-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-ink);
    }

    .grade-stats-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .grade-stat-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 7px;
      border: 1px solid transparent;
    }

    .team-members-ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .team-members-ul li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      background: var(--item-bg);
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
    }

    /* 学年バッジ */
    .grade-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    .grade-1, .grade-stat-tag.g1 {
      background: var(--g1-bg);
      color: var(--g1-ink);
      border-color: var(--g1-border);
    }

    .grade-2, .grade-stat-tag.g2 {
      background: var(--g2-bg);
      color: var(--g2-ink);
      border-color: var(--g2-border);
    }

    .grade-3, .grade-stat-tag.g3 {
      background: var(--g3-bg);
      color: var(--g3-ink);
      border-color: var(--g3-border);
    }

    /* -------------------------------------------------------------
       ボタン・入力フォームのスタイル
    ------------------------------------------------------------- */
    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 14px;
      color: white;
      background: linear-gradient(135deg, #7354ef, #4c75ee);
      box-shadow: 0 7px 14px rgba(87, 75, 196, 0.2);
      cursor: pointer;
      transition: transform 0.17s, box-shadow 0.17s, filter 0.17s, background 0.3s;
      font-family: var(--font-sans);
      font-weight: 700;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 11px 20px rgba(87, 75, 196, 0.28);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .notice {
      min-height: 18px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    .side-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-heading h2 {
      font-size: 20px;
    }

    .member-count {
      color: var(--badge-ink);
      background: var(--badge-bg);
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 12px;
    }

    .grade-summary-pills {
      display: flex;
      gap: 6px;
    }

    .grade-summary-pills span {
      flex: 1;
      text-align: center;
      padding: 5px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group-row {
      display: flex;
      gap: 8px;
    }

    .input-group input, 
    .input-group select, 
    .user-card input, 
    .user-card select,
    textarea {
      flex: 1;
      min-width: 0;
      padding: 10px 13px;
      color: var(--ink);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      outline: 0;
      font: inherit;
      font-size: 14px;
      transition: border 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s;
    }

    .input-group input:focus, 
    .input-group select:focus, 
    .user-card input:focus, 
    .user-card select:focus,
    textarea:focus {
      border-color: #876df3;
      box-shadow: 0 0 0 4px rgba(128, 100, 237, 0.14);
    }

    #add-btn {
      padding-inline: 16px;
      flex-shrink: 0;
    }

    /* メンバーリストのデザイン */
    #member-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      min-height: 120px;
      overflow-y: auto;
      padding: 2px;
    }

    @media (max-width: 879px) {
      #member-list {
        max-height: 260px;
      }
    }

    #member-list:empty::after {
      content: "参加者を待っています…（下のテキスト欄やQRコードからも追加できます）";
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 28px 10px;
      border: 1px dashed var(--input-border);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    #member-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px 8px 12px;
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 13px;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.25s, opacity 0.2s;
    }

    #member-list li.eliminated {
      color: var(--item-elim-ink);
      background: var(--item-elim-bg);
      opacity: 0.7;
    }

    #member-list li.eliminated .member-name-label {
      text-decoration: line-through;
    }

    .member-main {
      min-width: 0;
      overflow-wrap: anywhere;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .member-btn-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .member-toggle-btn {
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 8px;
      color: var(--badge-ink);
      background: var(--badge-bg);
      box-shadow: none;
    }

    .member-toggle-btn.is-off {
      color: var(--muted);
      background: var(--toggle-bg);
    }

    .member-toggle-btn:hover:not(:disabled) {
      box-shadow: none;
      transform: translateY(-1px);
    }

    /* 個別削除ボタンのスタイル */
    .member-delete-btn {
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 8px;
      color: var(--danger-ink);
      background: var(--danger-bg);
      box-shadow: none;
      flex-shrink: 0;
    }

    .member-delete-btn:hover:not(:disabled) {
      background: var(--danger-hover);
      box-shadow: none;
      transform: translateY(-1px);
    }

    /* 下部テキスト一括入力ボックス */
    .bulk-text-panel {
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 15px;
      padding: 11px;
      display: flex;

    }

    .bulk-text-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

    }

    .bulk-text-title {

      font-weight: 800;
      color: var(--purple);
    }

    .bulk-preview-pill {
      font-size: 11px;
      font-weight: 800;
      color: var(--badge-ink);
      background: var(--badge-bg);
      padding: 2px 8px;

    #bulk-textarea {
      width: 100%;
      min-height: 76px;
      max-height: 150px;
      resize: vertical;
      font-size: 13px;
      line-height: 1.45;
      padding: 8px 11px;
    }

    .bulk-text-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .bulk-hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }

    #bulk-add-btn {
      padding: 8px 13px;
      font-size: 12px;
      border-radius: 10px;
      background: linear-gradient(135deg, #35b997, #27a383);
      box-shadow: 0 5px 12px rgba(53, 185, 151, 0.25);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sidebar-footer-btns {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .sidebar-footer-btns button {
      flex: 1;
      padding: 10px 10px;
      font-size: 13px;
    }

    .danger-btn {
      color: var(--danger-ink);
      background: var(--danger-bg);
      box-shadow: none;
    }

    .danger-btn:hover:not(:disabled) {
      background: var(--danger-hover);
      box-shadow: none;
    }

    #qr-btn {
      background: var(--qr-btn-bg);
    }

    /* モーダルウィンドウ（QRコード表示・確認用） */
    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(15, 16, 36, 0.65);
      z-index: 20;
      backdrop-filter: blur(8px);

    .modal-content {

      padding: 26px;
      border-radius: 26px;
      background: var(--modal-bg);
      border: 1px solid var(--card-border);
      color: var(--ink);
      text-align: center;
      box-shadow: 0 25px 60px rgba(11, 11, 32, 0.35);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content h3 {
      font-size: 20px;
    }

    #qrcode {
      width: 184px;
      height: 184px;
      padding: 10px;
      margin: 6px auto !important;
      background: #ffffff;
      border: 1px solid #eeeaf8;

    }

    #qrcode img {
      border-radius: 8px;
    }

    .qr-link-box {
      display: flex;
      gap: 6px;
    }

    .qr-link-box input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--muted);
    }

    .qr-link-box button {
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 10px;
      box-shadow: none;
    }

    .hidden {
      display: none !important;
    }

    /* 参加者用入力画面のスタイル（元コード忠実再現） */
    .user-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .user-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 28px 30px;
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .user-card-top {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: -6px;
    }

    .join-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 2px;
      color: #fff;
      border-radius: 19px;
      background: linear-gradient(145deg, #8061f4, #4b7bed);
      box-shadow: 0 12px 22px rgba(93, 85, 214, 0.28);
      font-size: 26px;
    }

    .user-card h2 {
      font-size: 26px;
    }

    .user-card .notice {
      font-size: 13px;
    }

    .user-card input, 
    .user-card select, 
    .user-card button#submit-join-btn {
      padding: 14px;
      font-size: 15px;
      width: 100%;
    }

    .user-card button#submit-join-btn {
      border-radius: 14px;
      background: linear-gradient(120deg, #41cfa7, #2fbbbc);
      box-shadow: 0 10px 18px rgba(43, 185, 171, 0.25);
      font-size: 16px;
      margin-top: 4px;
    }

    .form-label {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: -10px;
    }

    /* トースト通知 */
    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1f2442;
      color: #ffffff;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 430px) {
      .container { padding: 14px; }
      .main-content { padding: 22px 16px 20px; }
      .sidebar { padding: 20px 16px; min-width: 0; }
      .user-card { padding: 24px 20px 26px; }
    }
  </style>
</head>
<body>

  <!-- アプリケーションが描画されるルート要素 -->
  <div id="app"></div>
  <!-- トースト通知 -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // -------------------------------------------------------------
    // 0. テーマ管理（ライトモード / ダークモード切り替え）
    // -------------------------------------------------------------
    const THEME_STORAGE_KEY = "team-divider-theme";
    let onThemeChangeCallback = null;

    function getInitialTheme() {
      const saved = localStorage.getItem(THEME_STORAGE_KEY);
      if (saved === "dark" || saved === "light") return saved;
      return "light";
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_STORAGE_KEY, theme);
      updateThemeToggleButtons(theme);
      if (typeof onThemeChangeCallback === "function") {
        onThemeChangeCallback(theme);
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      applyTheme(current === "dark" ? "light" : "dark");
    }

    function renderThemeToggleButton() {
      return `
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="テーマ切り替え">
          <span class="theme-icon"></span>
          <span class="theme-label"></span>
        </button>
      `;
    }

    function updateThemeToggleButtons(theme) {
      const isDark = theme === "dark";
      const sunSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
      const moonSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

      document.querySelectorAll("[data-theme-toggle]").forEach(btn => {
        btn.querySelector(".theme-icon").innerHTML = isDark ? sunSvg : moonSvg;
        btn.querySelector(".theme-label").textContent = isDark ? "ライト" : "ダーク";
      });
    }

    function bindThemeToggles() {
      document.querySelectorAll("[data-theme-toggle]").forEach(btn => {
        btn.addEventListener("click", toggleTheme);
      });
      updateThemeToggleButtons(document.documentElement.getAttribute("data-theme") || "light");
    }

    document.documentElement.setAttribute("data-theme", getInitialTheme());

    // -------------------------------------------------------------
    // 効果音（Web Audio API & オン・オフ管理）
    // -------------------------------------------------------------
    let audioCtx = null;
    let soundEnabled = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundToggleButtons();
    }

    function renderSoundToggleButton() {
      return `
        <button type="button" class="theme-toggle" data-sound-toggle aria-label="音声切り替え">
          <span class="sound-icon"></span>
          <span class="sound-label"></span>
        </button>
      `;
    }

    function updateSoundToggleButtons() {
      const soundOnSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;
      const soundOffSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;

      document.querySelectorAll("[data-sound-toggle]").forEach(btn => {
        btn.querySelector(".sound-icon").innerHTML = soundEnabled ? soundOnSvg : soundOffSvg;
        btn.querySelector(".sound-label").textContent = soundEnabled ? "ON" : "OFF";
      });
    }

    function bindSoundToggles() {
      document.querySelectorAll("[data-sound-toggle]").forEach(btn => {
        btn.addEventListener("click", toggleSound);
      });
      updateSoundToggleButtons();
    }

    function playTickSound() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(840, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.035);

      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.035);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];

      notes.forEach((freq, idx) => {
        const start = now + idx * 0.085;
        const duration = idx === notes.length - 1 ? 0.45 : 0.14;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.22, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(start);
        osc.stop(start + duration);
      });
    }

    // -------------------------------------------------------------
    // 1. Firebaseの設定と初期化
    // -------------------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://furiwake-2f59c-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const membersRef = db.ref("teamDivider/members");
    const joinRequestsRef = db.ref("teamDivider/joinRequests");
    const teamsRef = db.ref("teamDivider/teams");
    
    const params = new URLSearchParams(location.search);
    const isJoinMode = params.get("mode") === "join";
    const appEl = document.getElementById("app");

    const GRADE_OPTIONS = [
      { value: 1, label: "1年" },
      { value: 2, label: "2年" },
      { value: 3, label: "3年" }
    ];

    const TEAM_COLORS = [
      "#7354ef", "#37d5ae", "#ff6b81", "#f39c12",
      "#3498db", "#9b59b6", "#1abc9c", "#e67e22",
      "#e84393", "#00b894", "#6c5ce7", "#fdcb6e"
    ];

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
    }

    function safeName(value) { 
      return String(value || "").trim().slice(0, 40); 
    }

    function normalizeGrade(value) {
      const num = Number(value);
      return [1, 2, 3].includes(num) ? num : 1;
    }
    
    function memberKey(name) {
      return `join-${encodeURIComponent(name.toLocaleLowerCase()).replace(/\./g, "%2E")}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /**
     * 行末の数字（半角 1〜3 / 全角 １〜３、後ろの「年」も任意対応）から学年を自動抽出し、
     * 数字と空白を除いた文字列を名前として返すパーサー
     */
    function parseBulkText(text) {
      const lines = String(text || "")
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

      const results = [];
      lines.forEach(line => {
        const match = line.match(/^(.*?)[\s　,、/]*([1-3１-３])(?:年生?)?$/);
        if (match && match[1].trim()) {
          const name = safeName(match[1]);
          const halfDigit = match[2].replace(/[１-３]/g, ch =>
            String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
          );
          results.push({ name, grade: normalizeGrade(halfDigit) });
        } else {
          results.push({ name: safeName(line), grade: 1 });
        }
      });
      return results;
    }

    // -------------------------------------------------------------
    // 2. 画面ごとの振り分け処理（参加者用画面 vs ホスト用画面）
    // -------------------------------------------------------------
    if (isJoinMode) {
      // ===========================================================
      // スマホ参加者用画面（?mode=join）— 元コードのデザインを忠実再現
      // ===========================================================
      appEl.innerHTML = `
        <div class="user-container">
          <div class="user-card">
            <div class="user-card-top">
              ${renderThemeToggleButton()}
            </div>
            <div class="join-mark">⚖️</div>
            <p class="eyebrow">JOIN TEAM DIVIDER</p>
            <h2>チーム分けに参加</h2>
            <p class="notice">名前と学年を選択して送信すると、1・2・3年のバランスを保ってチーム分けされます！</p>
            
            <p class="form-label">名前</p>
            <input id="join-name-input" maxlength="40" placeholder="あなたの名前" autocomplete="off">
            
            <p class="form-label">学年は？</p>
            <select id="join-grade-select">
              ${GRADE_OPTIONS.map(g => `<option value="${g.value}">${g.label}</option>`).join('')}
            </select>

            <button id="submit-join-btn" disabled>接続を確認中…</button>
            <p id="join-status" class="notice">Firebaseへ接続しています…</p>
          </div>
        </div>
      `;

      bindThemeToggles();

      const input = document.getElementById("join-name-input");
      const select = document.getElementById("join-grade-select");
      const button = document.getElementById("submit-join-btn");
      const status = document.getElementById("join-status");
      let isConnected = false;

      db.ref(".info/connected").on("value", snapshot => {
        isConnected = snapshot.val() === true;
        button.disabled = !isConnected;
        button.textContent = isConnected ? "送信して参加" : "接続を確認中…";
        if (!isConnected) {
          status.style.color = "#e74c3c";
          status.textContent = "Firebaseに接続できません。";
        } else if (!status.textContent.includes("送信")) {
          status.style.color = "";
          status.textContent = "名前と学年を選択して送信してください。";
        }
      });

      async function submit() {
        if (!isConnected) return;
        const name = safeName(input.value);
        const grade = normalizeGrade(select.value);
        if (!name) { 
          status.style.color = "#e74c3c"; 
          status.textContent = "名前を入力してください。"; 
          return; 
        }
        
        button.disabled = true; 
        status.style.color = ""; 
        status.textContent = "送信中…";
        
        try {
          await joinRequestsRef.push({ 
            name, 
            grade, 
            createdAt: firebase.database.ServerValue.TIMESTAMP 
          });
          status.style.color = "#2ecc71"; 
          status.textContent = `「${name}」さん（${grade}年）を送信しました。`;
          input.value = "";
        } catch (error) {
          console.error(error);
          status.style.color = "#e74c3c"; 
          status.textContent = "送信できませんでした。";
        } finally { 
          button.disabled = !isConnected; 
        }
      }

      button.addEventListener("click", submit);
      input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

    } else {
      // ===========================================================
      // ホスト用メイン画面（学年バランス振り分け・QRコード・一括入力）
      // ===========================================================
      appEl.innerHTML = `
        <div class="container">
          <!-- メイン（チーム分け設定＆結果表示エリア） -->
          <main class="main-content">
            <div class="top-bar">
              <p class="eyebrow">TEAM DIVIDER</p>
              <div class="header-controls">
                ${renderThemeToggleButton()}
                ${renderSoundToggleButton()}
                <span class="host-badge">HOST</span>
              </div>
            </div>
            <div class="title-row">
              <h1>チーム分け!</h1>
            </div>

            <!-- 振り分け条件設定ボックス -->
            <div class="control-box">
              <div class="control-grid">
                <div class="control-col">
                  <span class="control-label">① 決め方の基準</span>
                  <div class="mode-tabs">
                    <button type="button" class="mode-tab-btn active" id="mode-teams-btn">チーム数で決める</button>
                    <button type="button" class="mode-tab-btn" id="mode-size-btn">人数で決める</button>
                  </div>
                  <div class="stepper-wrap">
                    <div class="stepper">
                      <button type="button" class="stepper-btn" id="dec-btn" aria-label="減らす">−</button>
                      <span class="stepper-value" id="target-val-text">3チーム</span>
                      <button type="button" class="stepper-btn" id="inc-btn" aria-label="増やす">＋</button>
                    </div>
                    <span class="sim-badge" id="sim-badge">参加者 0人</span>
                  </div>
                </div>

                <div class="control-col">
                  <span class="control-label">② 学年バランスの調整</span>
                  <div class="mode-tabs">
                    <button type="button" class="mode-tab-btn active" id="algo-balanced-btn">学年均等</button>
                    <button type="button" class="mode-tab-btn" id="algo-random-btn">ランダム</button>
                  </div>
                  <p id="algo-hint" style="font-size: 11.5px; color: var(--muted); line-height: 1.4;">
                    3年→2年→1年の順に蛇行ドラフト配分し、1つのチームに特定の学年が偏るのを防ぎます。
                  </p>
                </div>
              </div>

              <div class="main-action-row">
                <button type="button" id="divide-btn">チームを振り分ける！</button>
                <button type="button" id="copy-result-btn" disabled>📋 結果をコピー</button>
              </div>
            </div>

            <div class="result-header">
              <h2>振り分け結果</h2>
              <span id="host-status" class="notice" style="text-align: right;"></span>
            </div>

            <!-- チームカード表示グリッド -->
            <div id="teams-grid" class="teams-grid">
              <div class="empty-result">
                <div style="font-size: 36px;">⚖️</div>
                <p style="font-weight: 800; color: var(--ink);">「チームを振り分ける！」を押してください</p>
                <p style="font-size: 12.5px;">右側のメンバー追加・テキスト一括入力・QRコード参加から登録できます。</p>
              </div>
            </div>
          </main>
          
          <!-- サイドバー（メンバー一覧・追加・一括入力・QRコード管理用） -->
          <aside class="sidebar">
            <div class="side-heading">
              <h2>メンバー</h2>
              <span id="member-count" class="member-count">0人</span>
            </div>

            <!-- 学年別内訳サマリー -->
            <div class="grade-summary-pills">
              <span class="grade-1" id="sum-g1">1年: 0人</span>
              <span class="grade-2" id="sum-g2">2年: 0人</span>
              <span class="grade-3" id="sum-g3">3年: 0人</span>
            </div>

            <!-- 1人ずつ追加 -->
            <div class="input-group">
              <div class="input-group-row">
                <input id="member-input" maxlength="40" placeholder="メンバーを追加">
                <select id="member-grade-select" style="flex: 0 0 84px;">
                  ${GRADE_OPTIONS.map(g => `<option value="${g.value}" ${g.value === 3 ? "selected" : ""}>${g.label}</option>`).join('')}
                </select>
                <button type="button" id="add-btn">追加</button>
              </div>
            </div>

            <!-- メンバー一覧 -->
            <ul id="member-list"></ul>

            <!-- 下部テキスト一括入力（行末の数字から学年自動認識） -->
            <div class="bulk-text-panel">
              <div class="bulk-text-header">
                <span class="bulk-text-title">📝 テキスト一括入力（学年自動判定）</span>
                <span class="bulk-preview-pill" id="bulk-preview-pill">0人認識中</span>
              </div>
              <textarea id="bulk-textarea" rows="3" placeholder="名前と学年を入力"></textarea>
              <div class="bulk-text-footer">
                <span class="bulk-hint">行末の数字（1〜3 / １〜３）を自動で学年認識します</span>
                <button type="button" id="bulk-add-btn">一括追加</button>
              </div>
            </div>

            <!-- QRコード表示 & 全削除ボタン -->
            <div class="sidebar-footer-btns">
              <button type="button" id="qr-btn">QRコードを表示</button>
              <button type="button" id="reset-btn" class="danger-btn">全削除</button>
            </div>
            
            <!-- 参加用QRコードを表示するポップアップモーダル -->
            <div id="qr-modal" class="modal hidden">
              <div class="modal-content">
                <h3>スマホで読み込んで参加</h3>
                <p style="font-size: 12px; color: var(--muted);">読み込むと名前と学年を送れる参加画面が開きます</p>
                <div id="qrcode"></div>
                <div class="qr-link-box">
                  <input type="text" id="join-url-input" readonly>
                  <button type="button" id="copy-join-url-btn">URLコピー</button>
                </div>
                <button type="button" id="close-qr-btn">閉じる</button>
              </div>
            </div>

            <!-- 全削除確認モーダル -->
            <div id="reset-modal" class="modal hidden">
              <div class="modal-content">
                <h3>全員削除しますか？</h3>
                <p style="font-size: 13px; color: var(--muted);">登録されている全メンバーとチーム分け結果が削除されます。</p>
                <div style="display: flex; gap: 8px; margin-top: 6px;">
                  <button type="button" id="cancel-reset-btn" style="flex: 1; background: var(--toggle-bg); color: var(--ink); box-shadow: none;">キャンセル</button>
                  <button type="button" id="confirm-reset-btn" class="danger-btn" style="flex: 1;">削除する</button>
                </div>
              </div>
            </div>
          </aside>
        </div>
      `;

      bindThemeToggles();
      bindSoundToggles();

      let members = [];
      let divideMode = "teams"; // "teams" | "size"
      let algoMode = "balanced"; // "balanced" | "random"
      let targetTeams = 3;
      let targetSize = 3;
      let currentTeams = [];
      let isAnimating = false;

      const addBtn = document.getElementById("add-btn");
      const input = document.getElementById("member-input");
      const selectGrade = document.getElementById("member-grade-select");
      const list = document.getElementById("member-list");
      const memberCount = document.getElementById("member-count");
      const hostStatus = document.getElementById("host-status");
      const bulkTextarea = document.getElementById("bulk-textarea");
      const bulkPreviewPill = document.getElementById("bulk-preview-pill");

      function reportHostError(error) {
        console.error("Firebaseエラー", error);
        hostStatus.style.color = "#e74c3c";
        hostStatus.textContent = `Firebaseエラー: ${error.message}`;
      }

      db.ref(".info/connected").on("value", snap => {
        if (snap.val() === true) {
          hostStatus.textContent = "Firebaseリアルタイム同期中";
          hostStatus.style.color = "#2ecc71";
        } else {
          hostStatus.textContent = "Firebase接続待機中…";
          hostStatus.style.color = "#f39c12";
        }
      });

      listenForJoinRequests();

      // メンバー一覧のリアルタイム同期
      membersRef.on("value", snapshot => {
        const data = snapshot.val() || {};
        const unique = new Map();
        
        Object.entries(data).forEach(([id, rawMember]) => {
          const isObject = rawMember && typeof rawMember === "object";
          const name = safeName(isObject ? rawMember.name : rawMember);
          if (!name) return;

          const grade = normalizeGrade(isObject ? rawMember.grade : 1);
          const eliminated = Boolean(isObject && rawMember.eliminated);
          const key = name.toLocaleLowerCase();
          
          if (unique.has(key)) {
            const existing = unique.get(key);
            existing.ids.push(id);
            existing.grade = grade;
            if (existing.eliminated && !eliminated) { 
              existing.id = id; 
              existing.eliminated = false; 
            }
          } else {
            unique.set(key, { id, ids: [id], name, grade, eliminated });
          }
        });
        
        members = [...unique.values()];
        updateUI();
      }, reportHostError);

      // 最新のチーム分け結果のリアルタイム同期
      teamsRef.on("value", snapshot => {
        if (isAnimating) return;
        const val = snapshot.val();
        if (val && Array.isArray(val.teams) && val.teams.length > 0) {
          currentTeams = val.teams;
          renderTeams(currentTeams, false);
          document.getElementById("copy-result-btn").disabled = false;
        }
      });

      // スマホからの参加リクエスト監視（元コードと同じ仕組み）
      function listenForJoinRequests() {
        joinRequestsRef.on("child_added", async snapshot => {
          const val = snapshot.val();
          const name = safeName(val && val.name);
          const grade = normalizeGrade(val && val.grade);
          if (!name) return;
          try {
            await membersRef.child(memberKey(name)).set({ name, grade, eliminated: false });
            await snapshot.ref.remove();
            showToast(`📱 ${grade}年「${name}」さんが参加しました！`);
          } catch (error) { 
            reportHostError(error); 
          }
        }, reportHostError);
      }

      function updateUI() {
        list.innerHTML = "";
        const activeMembers = members.filter(member => !member.eliminated);
        memberCount.textContent = `${activeMembers.length}人`;

        const g1 = activeMembers.filter(m => m.grade === 1).length;
        const g2 = activeMembers.filter(m => m.grade === 2).length;
        const g3 = activeMembers.filter(m => m.grade === 3).length;
        document.getElementById("sum-g1").textContent = `1年: ${g1}人`;
        document.getElementById("sum-g2").textContent = `2年: ${g2}人`;
        document.getElementById("sum-g3").textContent = `3年: ${g3}人`;

        // 3年→2年→1年の順に見やすく並べる
        const sorted = [...members].sort((a, b) => b.grade - a.grade);
        
        sorted.forEach(member => {
          const li = document.createElement("li");
          if (member.eliminated) li.classList.add("eliminated");

          const label = document.createElement("div");
          label.className = "member-main"; 
          label.innerHTML = `
            <span class="grade-badge grade-${member.grade}">${member.grade}年</span>
            <span class="member-name-label">${escapeHtml(member.name)}</span>
          `;

          const btnGroup = document.createElement("div");
          btnGroup.className = "member-btn-group";

          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = `member-toggle-btn ${member.eliminated ? "is-off" : ""}`;
          toggleBtn.textContent = member.eliminated ? "休み" : "参加";
          toggleBtn.addEventListener("click", () => {
            const nextEliminated = !member.eliminated;
            Promise.all(member.ids.map(id =>
              membersRef.child(id).update({ eliminated: nextEliminated })
            )).catch(reportHostError);
          });

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "member-delete-btn";
          delBtn.textContent = "削除";
          delBtn.addEventListener("click", () => {
            Promise.all(member.ids.map(id => membersRef.child(id).remove())).catch(reportHostError);
            showToast(`「${member.name}」を削除しました`);
          });

          btnGroup.append(toggleBtn, delBtn);
          li.append(label, btnGroup);
          list.appendChild(li);
        });

        updateSimulationBadge();
      }

      function updateSimulationBadge() {
        const activeCount = members.filter(m => !m.eliminated).length;
        const simBadge = document.getElementById("sim-badge");
        if (activeCount === 0) {
          simBadge.textContent = "参加者 0人";
          return;
        }
        const numTeams = divideMode === "teams"
          ? Math.min(targetTeams, activeCount)
          : Math.max(1, Math.ceil(activeCount / targetSize));
        const base = Math.floor(activeCount / numTeams);
        const rem = activeCount % numTeams;
        simBadge.textContent = rem === 0
          ? `${numTeams}チーム（各${base}人）`
          : `${numTeams}チーム（${base}〜${base + 1}人）`;
      }

      function updateControlUI() {
        document.getElementById("mode-teams-btn").classList.toggle("active", divideMode === "teams");
        document.getElementById("mode-size-btn").classList.toggle("active", divideMode === "size");
        document.getElementById("algo-balanced-btn").classList.toggle("active", algoMode === "balanced");
        document.getElementById("algo-random-btn").classList.toggle("active", algoMode === "random");

        document.getElementById("target-val-text").textContent = divideMode === "teams"
          ? `${targetTeams}チーム`
          : `1チーム ${targetSize}人`;

        document.getElementById("algo-hint").textContent = algoMode === "balanced"
          ? "3年→2年→1年の順に蛇行ドラフト配分し、1つのチームに特定の学年が偏るのを防ぎます。"
          : "学年を考慮せず、参加メンバー全員を完全にランダムでチーム分けします。";

        updateSimulationBadge();
      }

      document.getElementById("mode-teams-btn").addEventListener("click", () => {
        divideMode = "teams";
        updateControlUI();
      });
      document.getElementById("mode-size-btn").addEventListener("click", () => {
        divideMode = "size";
        updateControlUI();
      });
      document.getElementById("algo-balanced-btn").addEventListener("click", () => {
        algoMode = "balanced";
        updateControlUI();
      });
      document.getElementById("algo-random-btn").addEventListener("click", () => {
        algoMode = "random";
        updateControlUI();
      });
      document.getElementById("dec-btn").addEventListener("click", () => {
        if (divideMode === "teams" && targetTeams > 2) targetTeams--;
        if (divideMode === "size" && targetSize > 2) targetSize--;
        updateControlUI();
      });
      document.getElementById("inc-btn").addEventListener("click", () => {
        if (divideMode === "teams" && targetTeams < 12) targetTeams++;
        if (divideMode === "size" && targetSize < 15) targetSize++;
        updateControlUI();
      });

      // 1人追加
      function addMember() { 
        const name = safeName(input.value); 
        const grade = normalizeGrade(selectGrade.value);
        if (name) { 
          membersRef.child(memberKey(name)).set({ name, grade, eliminated: false }).catch(reportHostError); 
          input.value = ""; 
          showToast(`${grade}年「${name}」を追加しました`);
        } 
      }
      addBtn.addEventListener("click", addMember); 
      input.addEventListener("keydown", e => { if (e.key === "Enter") addMember(); });

      // テキスト一括入力のリアルタイムプレビュー＆登録
      function updateBulkPreview() {
        const parsed = parseBulkText(bulkTextarea.value);
        if (parsed.length === 0) {
          bulkPreviewPill.textContent = "0人認識中";
          return;
        }
        const c1 = parsed.filter(p => p.grade === 1).length;
        const c2 = parsed.filter(p => p.grade === 2).length;
        const c3 = parsed.filter(p => p.grade === 3).length;
        bulkPreviewPill.textContent = `${parsed.length}人（1年:${c1} / 2年:${c2} / 3年:${c3}）`;
      }

      bulkTextarea.addEventListener("input", updateBulkPreview);

      document.getElementById("bulk-add-btn").addEventListener("click", async () => {
        const parsed = parseBulkText(bulkTextarea.value);
        if (parsed.length === 0) {
          showToast("名前と学年を入力してください");
          bulkTextarea.focus();
          return;
        }
        try {
          const updates = {};
          parsed.forEach(item => {
            updates[memberKey(item.name)] = {
              name: item.name,
              grade: item.grade,
              eliminated: false
            };
          });
          await membersRef.update(updates);
          bulkTextarea.value = "";
          updateBulkPreview();
          showToast(`✨ ${parsed.length}人を学年付きで一括追加しました！`);
        } catch (error) {
          reportHostError(error);
        }
      });

      // シャッフルヘルパー
      function shuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      // 学年均等（蛇行ドラフト）振り分け計算
      function generateTeams(eligible) {
        const total = eligible.length;
        if (!total) return [];

        const numTeams = divideMode === "teams"
          ? Math.min(targetTeams, total)
          : Math.max(1, Math.ceil(total / targetSize));

        const teams = Array.from({ length: numTeams }, (_, i) => ({
          name: `チーム ${String.fromCharCode(65 + i)}`,
          color: TEAM_COLORS[i % TEAM_COLORS.length],
          members: []
        }));

        if (algoMode === "random") {
          shuffle(eligible).forEach((m, idx) => {
            teams[idx % numTeams].members.push({ name: m.name, grade: m.grade });
          });
        } else {
          const g3 = shuffle(eligible.filter(m => m.grade === 3));
          const g2 = shuffle(eligible.filter(m => m.grade === 2));
          const g1 = shuffle(eligible.filter(m => m.grade === 1));
          const pool = [...g3, ...g2, ...g1];
          const offset = Math.floor(Math.random() * numTeams);

          pool.forEach((m, idx) => {
            const round = Math.floor(idx / numTeams);
            const pos = idx % numTeams;
            const baseIdx = round % 2 === 0 ? pos : (numTeams - 1 - pos);
            const teamIdx = (baseIdx + offset) % numTeams;
            teams[teamIdx].members.push({ name: m.name, grade: m.grade });
          });
        }

        teams.forEach(t => t.members.sort((a, b) => b.grade - a.grade));
        return teams;
      }

      function renderTeams(teams, shuffling = false) {
        const grid = document.getElementById("teams-grid");
        grid.innerHTML = "";

        teams.forEach((team, idx) => {
          const tMembers = Array.isArray(team.members) ? team.members : [];
          const g3 = tMembers.filter(m => m.grade === 3).length;
          const g2 = tMembers.filter(m => m.grade === 2).length;
          const g1 = tMembers.filter(m => m.grade === 1).length;

          const card = document.createElement("div");
          card.className = `team-card ${shuffling ? "shuffling" : ""}`;
          if (!shuffling) card.style.animationDelay = `${idx * 0.05}s`;

          card.innerHTML = `
            <div class="team-card-top">
              <div class="team-title">
                <span class="team-color-dot" style="background: ${team.color};"></span>
                <span>${escapeHtml(team.name)}</span>
              </div>
              <span class="team-size-pill">${tMembers.length}人</span>
            </div>
            <div class="grade-stats-row">
              <span class="grade-stat-tag g3">3年: ${g3}</span>
              <span class="grade-stat-tag g2">2年: ${g2}</span>
              <span class="grade-stat-tag g1">1年: ${g1}</span>
            </div>
            <ul class="team-members-ul">
              ${tMembers.map(m => `
                <li>
                  <span>${escapeHtml(m.name)}</span>
                  <span class="grade-badge grade-${m.grade}">${m.grade}年</span>
                </li>
              `).join("")}
            </ul>
          `;
          grid.appendChild(card);
        });
      }

      // 振り分け実行ボタン
      const divideBtn = document.getElementById("divide-btn");
      const copyResultBtn = document.getElementById("copy-result-btn");

      divideBtn.addEventListener("click", () => {
        const eligible = members.filter(m => !m.eliminated);
        if (isAnimating || eligible.length < 2) {
          if (eligible.length < 2) showToast("参加メンバーを2人以上にしてください");
          return;
        }

        if (soundEnabled) getAudioContext();
        isAnimating = true;
        divideBtn.disabled = true;
        copyResultBtn.disabled = true;

        let step = 0;
        const maxSteps = 10;
        const interval = setInterval(async () => {
          step++;
          renderTeams(generateTeams(eligible), true);
          playTickSound();

          if (step >= maxSteps) {
            clearInterval(interval);
            currentTeams = generateTeams(eligible);
            renderTeams(currentTeams, false);
            playWinSound();

            try {
              await teamsRef.set({
                teams: currentTeams,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
              });
            } catch (err) {
              console.error(err);
            }

            isAnimating = false;
            divideBtn.disabled = false;
            copyResultBtn.disabled = false;
          }
        }, 65);
      });

      // 結果コピーボタン
      copyResultBtn.addEventListener("click", () => {
        if (!currentTeams.length) return;
        const lines = ["【チーム分け結果】"];
        currentTeams.forEach(t => {
          const tMembers = Array.isArray(t.members) ? t.members : [];
          const g3 = tMembers.filter(m => m.grade === 3).length;
          const g2 = tMembers.filter(m => m.grade === 2).length;
          const g1 = tMembers.filter(m => m.grade === 1).length;
          lines.push(`\n■ ${t.name}（${tMembers.length}人｜3年:${g3} / 2年:${g2} / 1年:${g1}）`);
          tMembers.forEach(m => lines.push(`・${m.name}（${m.grade}年）`));
        });

        const ta = document.createElement("textarea");
        ta.value = lines.join("\n");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast("📋 チーム分け結果をコピーしました！");
        } finally {
          document.body.removeChild(ta);
        }
      });

      // 全削除モーダル
      const resetModal = document.getElementById("reset-modal");
      document.getElementById("reset-btn").addEventListener("click", () => {
        resetModal.classList.remove("hidden");
      });
      document.getElementById("cancel-reset-btn").addEventListener("click", () => {
        resetModal.classList.add("hidden");
      });
      document.getElementById("confirm-reset-btn").addEventListener("click", async () => {
        resetModal.classList.add("hidden");
        try {
          const pending = await joinRequestsRef.once("value");
          await Promise.all(Object.keys(pending.val() || {}).map(id => joinRequestsRef.child(id).remove()));
          await membersRef.remove();
          await teamsRef.remove();
          members = [];
          currentTeams = [];
          document.getElementById("teams-grid").innerHTML = `
            <div class="empty-result">
              <div style="font-size: 36px;">⚖️</div>
              <p style="font-weight: 800; color: var(--ink);">「チームを振り分ける！」を押してください</p>
              <p style="font-size: 12.5px;">右側のメンバー追加・テキスト一括入力・QRコード参加から登録できます。</p>
            </div>
          `;
          copyResultBtn.disabled = true;
          updateUI();
          showToast("メンバーを全削除しました");
        } catch (error) { 
          reportHostError(error); 
        }
      });

      // QRコード表示モーダル（元コードと同じ仕組み＋参加URLコピー機能）
      const modal = document.getElementById("qr-modal");
      const joinUrlInput = document.getElementById("join-url-input");
      document.getElementById("qr-btn").addEventListener("click", () => { 
        modal.classList.remove("hidden"); 
        const joinUrl = `${location.origin}${location.pathname}?mode=join`;
        joinUrlInput.value = joinUrl;
        const el = document.getElementById("qrcode"); 
        el.innerHTML = ""; 
        new QRCode(el, { 
          text: joinUrl, 
          width: 164, 
          height: 164 
        }); 
      });
      document.getElementById("copy-join-url-btn").addEventListener("click", () => {
        joinUrlInput.select();
        document.execCommand("copy");
        showToast("参加用URLをコピーしました！");
      });
      document.getElementById("close-qr-btn").addEventListener("click", () => modal.classList.add("hidden"));

      updateControlUI();
      updateBulkPreview();
    }
  </script>
</body>
</html>
